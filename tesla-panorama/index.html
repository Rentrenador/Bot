<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Tesla Panorama — mapa interactivo de la compañía (España/EU). FTT/STAR opcional." />
  <meta name="theme-color" content="#000000" />
  <title>Tesla Panorama · España</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button type="button" class="brand" data-nav="home" aria-label="Ir al inicio">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span class="brand-text">
          <strong>Tesla Panorama</strong>
          <small>Compañía · España / EU</small>
        </span>
      </button>
      <nav class="topnav" aria-label="Principal">
        <button type="button" data-nav="home">Inicio</button>
        <button type="button" data-nav="modules">Módulos</button>
        <button type="button" data-nav="examen">Quiz</button>
        <button type="button" data-nav="star" hidden style="display:none">STAR</button>
      </nav>
      <div class="topbar-meta">
        <span id="progress-pill" class="pill" title="Progreso global">0%</span>
      </div>
    </header>
    <main id="main" class="main" tabindex="-1"></main>
    <nav class="bottomnav" aria-label="Móvil">
      <button type="button" data-nav="home"><span>⌂</span>Inicio</button>
      <button type="button" data-nav="modules"><span>▣</span>Módulos</button>
      <button type="button" data-nav="examen"><span>?</span>Quiz</button>
      <button type="button" data-nav="star" hidden style="display:none"><span>★</span>STAR</button>
    </nav>
    <footer class="footer">
      <p>Contenido de estudio no oficial · hechos públicos · verifica en tesla.com/es_es · fuente: tesla-panorama-content/</p>
    </footer>
  </div>
  <script src="js/quiz-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
